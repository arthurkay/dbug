<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b3b3b"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#18181b"/>
  <!-- Legs - left -->
  <line x1="140" y1="200" x2="60" y2="150" stroke="#52525b" stroke-width="12" stroke-linecap="round"/>
  <line x1="120" y1="260" x2="40" y2="260" stroke="#52525b" stroke-width="12" stroke-linecap="round"/>
  <line x1="140" y1="320" x2="60" y2="370" stroke="#52525b" stroke-width="12" stroke-linecap="round"/>
  <!-- Legs - right -->
  <line x1="372" y1="200" x2="452" y2="150" stroke="#52525b" stroke-width="12" stroke-linecap="round"/>
  <line x1="392" y1="260" x2="472" y2="260" stroke="#52525b" stroke-width="12" stroke-linecap="round"/>
  <line x1="372" y1="320" x2="452" y2="370" stroke="#52525b" stroke-width="12" stroke-linecap="round"/>
  <!-- Antennae -->
  <path d="M210 170 Q180 100 140 70" stroke="#52525b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="135" cy="65" r="10" fill="#52525b"/>
  <path d="M302 170 Q332 100 372 70" stroke="#52525b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="377" cy="65" r="10" fill="#52525b"/>
  <!-- Head -->
  <ellipse cx="256" cy="175" rx="70" ry="55" fill="url(#bodyGrad)"/>
  <!-- Eyes - green (request/sent) and red (response/received) -->
  <circle cx="228" cy="165" r="16" fill="#22c55e"/>
  <circle cx="228" cy="165" r="7" fill="#18181b"/>
  <circle cx="284" cy="165" r="16" fill="#ef4444"/>
  <circle cx="284" cy="165" r="7" fill="#18181b"/>
  <!-- Body shell -->
  <ellipse cx="256" cy="290" rx="110" ry="120" fill="url(#bodyGrad)"/>
  <!-- Shell split line -->
  <line x1="256" y1="185" x2="256" y2="400" stroke="#27272a" stroke-width="3"/>
  <!-- Shell segments -->
  <path d="M160 250 Q256 235 352 250" stroke="#27272a" stroke-width="2" fill="none"/>
  <path d="M155 300 Q256 285 357 300" stroke="#27272a" stroke-width="2" fill="none"/>
  <path d="M165 350 Q256 335 347 350" stroke="#27272a" stroke-width="2" fill="none"/>
  <!-- Small code brackets on shell -->
  <text x="210" y="295" font-family="monospace" font-size="28" font-weight="bold" fill="#71717a" text-anchor="middle">&lt;/&gt;</text>
</svg>
