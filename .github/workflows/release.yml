name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.x"
  FLUTTER_CHANNEL: "stable"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        # package:sqlite3's build hook downloads a prebuilt libsqlite3.so from
        # GitHub releases at build time; that download occasionally flakes on
        # CI runners (v0.1.4 attempt 4 failed this way), so retry the build.
        run: |
          for attempt in 1 2 3; do
            flutter build linux --release && exit 0
            echo "Build failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Package Linux build
        run: tar -czf build/dbug-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/dbug-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS build
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/dbug.app build/dbug-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build/dbug-macos.zip

  build-windows:
    runs-on: windows-2022
    env:
      SQLITE3_LIB_DIR: "C:\\sqlite3"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare sqlite3 native library
        shell: pwsh
        run: |
          $dest = "C:\sqlite3"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $url = "https://www.sqlite.org/2024/sqlite-dll-win-x64-3460000.zip"
          $zip = "$env:RUNNER_TEMP\sqlite3.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          dir $dest

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows build (zip)
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/dbug-windows-x64.zip

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows\installer\dbug.iss'

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/dbug-windows-x64.zip

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-setup
          path: build/dbug-windows-x64-setup.exe

  publish-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            linux-x64/dbug-linux-x64.tar.gz
            macos-universal/dbug-macos.zip
            windows-x64/dbug-windows-x64.zip
            windows-x64-setup/dbug-windows-x64-setup.exe
