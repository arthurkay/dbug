name: dbug
description: "A local API testing tool like Postman, built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  shadcn_flutter: ^0.0.53
  google_fonts: ^6.0.0

  # State Management
  flutter_riverpod: ^2.6.0

  # Routing
  go_router: ^14.0.0

  # Database
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # HTTP
  dio: ^5.7.0
  http: ^1.2.0

  # Models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.5.0
  intl: ^0.20.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.0

  # Mock Server
  shelf: ^1.4.0
  shelf_router: ^1.1.0

  # Scripting
  flutter_js: ^0.8.0

  # OpenAPI / YAML
  yaml: ^3.1.0

  # Syntax highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
